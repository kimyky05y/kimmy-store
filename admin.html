<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin KIMMY STORE</title>
<style>
:root{--navy:#263F55;--dusty:#527A96;--cream:#F7E9B8;--mustard:#D99A3D;--terracotta:#B5654A;--putih:#FFFFFF;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--navy);color:var(--navy);min-height:100vh;padding:16px}
h1{color:var(--cream);text-align:center;margin-bottom:6px;font-size:1.4rem}
.sub{color:var(--cream);text-align:center;opacity:.8;font-size:.85rem;margin-bottom:14px}
.kartu{background:var(--putih);border-radius:14px;padding:16px;max-width:700px;margin:0 auto 14px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
label{display:block;font-size:.85rem;font-weight:bold;margin-top:10px}
input,select,textarea{width:100%;padding:9px;margin-top:4px;border:1px solid var(--dusty);border-radius:10px;font-size:.95rem;font-family:inherit}
button{background:var(--navy);color:var(--cream);border:none;border-radius:999px;padding:9px 16px;font-size:.9rem;cursor:pointer;margin-top:10px}
button.kecil{padding:6px 12px;font-size:.8rem;margin-top:0}
button.keluar{background:var(--terracotta)}
button.oranye{background:var(--mustard);color:var(--navy)}
button:disabled{opacity:.6}
.tabs{display:flex;gap:8px;max-width:700px;margin:0 auto 14px}
.tabs button{flex:1;margin-top:0;background:var(--dusty)}
.tabs button.aktif{background:var(--cream);color:var(--navy)}
.pesanan,.kartu-produk{border-top:1px dashed var(--dusty);padding-top:12px;margin-top:12px}
.baris{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.kode{font-weight:bold}
.status{display:inline-block;font-size:.75rem;padding:3px 10px;border-radius:999px;background:#E8EEF3}
.item,.muted{font-size:.85rem;color:#444;margin-top:3px}
.muted{color:var(--dusty)}
.varian-box{background:#F4F8FB;border-radius:10px;padding:10px;margin-top:10px}
.varian-box .baris input{margin-top:0}
