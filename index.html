<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIMMY STORE</title>
  <style>
    :root {
      --navy: #263F55;
      --dusty: #527A96;
      --cream: #F7E9B8;
      --mustard: #D99A3D;
      --terracotta: #B5654A;
      --putih: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--navy);
      color: var(--navy);
      min-height: 100vh;
    }
    header { background: var(--navy); color: var(--cream); padding: 20px 16px; text-align: center; }
    header h1 { font-size: 1.6rem; letter-spacing: 1px; }
    header p { font-size: 0.9rem; opacity: 0.85; margin-top: 4px; }
    main { padding: 16px; max-width: 900px; margin: 0 auto; }
    h2 { color: var(--cream); margin: 20px 0 12px; font-size: 1.2rem; }
    .info { color: var(--cream); line-height: 1.5; word-break: break-word; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
    .card { background: var(--putih); border-radius: 14px; padding: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .card h3 { font-size: 1rem; margin-bottom: 6px; }
    .card .kategori { font-size: 0.75rem; color: var(--dusty); margin-bottom: 8px; }
    .card .harga { font-weight: bold; color: var(--navy); margin-top: 6px; }
    .badge { display: inline-block; font-size: 0.7rem; padding: 3px 8px; border-radius: 999px; margin-top: 6px; }
    .tersedia { background: #DFF3E4; color: #1E6B35; }
    .habis { background: #F6D5D0; color: #8A2A1A; }
    .pesan { color: var(--cream); text-align: center; margin-top: 24px; font-size: 0.85rem; }
  </style>
</head>
<body>

<header>
  <h1>KIMMY STORE</h1>
  <p>Digital products & app services</p>
</header>

<main>
  <h2>Produk Kami</h2>
  <div class="grid" id="daftar-produk">
    <p class="info">Memuat produk...</p>
  </div>
  <p class="pesan">Trusted & cute since 2022</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://yftnynobgxvulhmgirdx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_wa6K5apeG3eW1eMVFa3xvg_DMgax51E";

  const wadah = document.getElementById("daftar-produk");

  function tampilkanError(teks) {
    wadah.innerHTML = '<p class="info">Gagal: ' + teks + '</p>';
  }

  async function muatProduk() {
    if (!window.supabase) {
      tampilkanError("library Supabase tidak termuat");
      return;
    }

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const { data, error } = await supabase
      .from("products")
      .select("id, name, description, categories(name), product_variants(name, price, stock_status)")
      .eq("is_active", true);

    if (error) {
      tampilkanError(error.message);
      console.error(error);
      return;
    }

    if (!data || data.length === 0) {
      wadah.innerHTML = '<p class="info">Belum ada produk.</p>';
      return;
    }

    wadah.innerHTML = data.map(p => {
      const varian = p.product_variants || [];
      const pertama = varian[0];
      const harga = pertama ? "Rp " + pertama.price.toLocaleString("id-ID") : "-";
      const status = pertama && pertama.stock_status === "tersedia" ? "tersedia" : "habis";
      return `
        <div class="card">
          <div class="kategori">${p.categories ? p.categories.name : ""}</div>
          <h3>${p.name}</h3>
          <div class="harga">mulai ${harga}</div>
          <span class="badge ${status}">${status === "tersedia" ? "Tersedia" : "Habis"}</span>
        </div>`;
    }).join("");
  }

  muatProduk();
</script>

</body>
</html>
