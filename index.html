<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIMMY STORE</title>
  <style>
    :root {
      --navy: #263F55;
      --dusty: #527A96;
      --cream: #F7E9B8;
      --mustard: #D99A3D;
      --terracotta: #B5654A;
      --putih: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--navy);
      color: var(--navy);
      min-height: 100vh;
    }
    header { background: var(--navy); color: var(--cream); padding: 20px 16px; text-align: center; }
    header h1 { font-size: 1.6rem; letter-spacing: 1px; }
    header p { font-size: 0.9rem; opacity: 0.85; margin-top: 4px; }
    .tombol-keranjang-atas {
      display: inline-block; margin-top: 10px; background: var(--mustard); color: var(--navy);
      padding: 6px 14px; border-radius: 999px; text-decoration: none; font-weight: bold; font-size: 0.85rem;
    }
    main { padding: 16px; max-width: 900px; margin: 0 auto; }
    h2 { color: var(--cream); margin: 20px 0 12px; font-size: 1.2rem; }
    .info { color: var(--cream); line-height: 1.5; word-break: break-word; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .card { background: var(--putih); border-radius: 14px; padding: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .card h3 { font-size: 1.05rem; margin-bottom: 4px; }
    .card .kategori { font-size: 0.75rem; color: var(--dusty); }
    .varian { border-top: 1px dashed var(--dusty); padding: 10px 0; }
    .varian .nama { font-weight: bold; }
    .varian .harga { color: var(--navy); margin-top: 2px; }
    .badge { display: inline-block; font-size: 0.7rem; padding: 3px 8px; border-radius: 999px; margin-top: 6px; }
    .tersedia { background: #DFF3E4; color: #1E6B35; }
    .habis { background: #F6D5D0; color: #8A2A1A; }
    .tombol {
      display: inline-block; margin-top: 8px; background: var(--navy); color: var(--cream);
      padding: 7px 16px; border: none; border-radius: 999px; font-size: 0.85rem; cursor: pointer;
    }
    .kotak-keranjang {
      background: var(--putih); color: var(--navy); border-radius: 14px;
      padding: 14px; margin-top: 24px; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .kotak-keranjang h2 { color: var(--navy); margin-top: 0; }
    .item-keranjang { border-top: 1px dashed var(--dusty); padding: 10px 0; }
    .kontrol { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .kontrol button {
      background: var(--dusty); color: var(--putih); border: none; border-radius: 8px;
      padding: 4px 10px; font-size: 0.95rem; cursor: pointer;
    }
    .kontrol .hapus { background: var(--terracotta); margin-left: auto; font-size: 0.8rem; }
    .subtotal { text-align: right; font-weight: bold; margin-top: 4px; }
    .total { border-top: 2px solid var(--navy); margin-top: 10px; padding-top: 10px; text-align: right; font-size: 1.05rem; }
    .formulir { margin-top: 16px; border-top: 2px dashed var(--dusty); padding-top: 14px; }
    .formulir label { display: block; font-size: 0.85rem; margin-top: 10px; font-weight: bold; }
    .formulir input {
      width: 100%; padding: 10px; margin-top: 4px; border: 1px solid var(--dusty);
      border-radius: 10px; font-size: 1rem;
    }
    .tombol-checkout {
      width: 100%; margin-top: 16px; background: var(--mustard); color: var(--navy);
      border: none; border-radius: 999px; padding: 12px; font-weight: bold; font-size: 1rem; cursor: pointer;
    }
    .tombol-checkout:disabled { opacity: 0.6; cursor: not-allowed; }
    .notif { margin-top: 12px; padding: 10px; border-radius: 10px; font-size: 0.9rem; }
    .notif.sukses { background: #DFF3E4; color: #1E6B35; }
    .notif.gagal { background: #F6D5D0; color: #8A2A1A; }
    .pesan { color: var(--cream); text-align: center; margin-top: 24px; font-size: 0.85rem; }
  </style>
</head>
<body>

<header>
  <h1>KIMMY STORE</h1>
  <p>Digital products & app services</p>
  <a class="tombol-keranjang-atas" href="#keranjang">Keranjang (<span id="jumlah-keranjang">0</span>)</a>
</header>

<main>
  <h2>Produk Kami</h2>
  <div class="grid" id="daftar-produk">
    <p class="info">Memuat produk...</p>
  </div>

  <section class="kotak-keranjang" id="keranjang">
    <h2>Keranjang Saya</h2>
    <div id="isi-keranjang"></div>
  </section>

  <p class="pesan">Trusted & cute since 2022</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://yftnynobgxvulhmgirdx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_wa6K5apeG3eW1eMVFa3xvg_DMgax51E";

  // NOMOR WHATSAPP ADMIN: ganti di sini (kode negara, tanpa + dan tanpa spasi)
  const WA_ADMIN = "6281234567890";

  const MAKS_QTY = 10;
  const KUNCI_KERANJANG = "kimmy_keranjang";

  const wadah = document.getElementById("daftar-produk");
  const daftarVarian = {};
  let keranjang = [];
  let supabase = null;

  try {
    keranjang = JSON.parse(localStorage.getItem(KUNCI_KERANJANG)) || [];
  } catch (e) {
    keranjang = [];
  }

  function rupiah(angka) {
    return "Rp " + Number(angka).toLocaleString("id-ID");
  }

  function simpanKeranjang() {
    localStorage.setItem(KUNCI_KERANJANG, JSON.stringify(keranjang));
  }

  function tambahKeranjang(id) {
    const v = daftarVarian[id];
    if (!v) return;
    const item = keranjang.find(i => i.id === id);
    if (item) {
      if (item.qty < MAKS_QTY) item.qty++;
    } else {
      keranjang.push({ id: id, produk: v.produk, varian: v.varian, harga: v.harga, qty: 1 });
    }
    simpanKeranjang();
    renderKeranjang();
  }

  function ubahQty(id, selisih) {
    const item = keranjang.find(i => i.id === id);
    if (!item) return;
    item.qty += selisih;
    if (item.qty < 1) {
      keranjang = keranjang.filter(i => i.id !== id);
    } else if (item.qty > MAKS_QTY) {
      item.qty = MAKS_QTY;
    }
    simpanKeranjang();
    renderKeranjang();
  }

  function hapusItem(id) {
    keranjang = keranjang.filter(i => i.id !== id);
    simpanKeranjang();
    renderKeranjang();
  }

  function renderKeranjang(notifikasi) {
    const wadahK = document.getElementById("isi-keranjang");
    const jumlah = keranjang.reduce((s, i) => s + i.qty, 0);
    document.getElementById("jumlah-keranjang").textContent = jumlah;

    let notifHTML = "";
    if (notifikasi) {
      notifHTML = '<div class="notif ' + notifikasi.jenis + '">' + notifikasi.teks + '</div>';
    }

    if (keranjang.length === 0) {
      wadahK.innerHTML = notifHTML + '<p>Keranjang masih kosong. Pilih produk di atas.</p>';
      return;
    }

    let total = 0;
    const baris = keranjang.map(i => {
      const subtotal = i.harga * i.qty;
      total += subtotal;
      return `
        <div class="item-keranjang">
          <div><strong>${i.produk}</strong><br>${i.varian} · ${rupiah(i.harga)}</div>
          <div class="kontrol">
            <button onclick="ubahQty(${i.id}, -1)">−</button>
            <span>${i.qty}</span>
            <button onclick="ubahQty(${i.id}, 1)">+</button>
            <button class="hapus" onclick="hapusItem(${i.id})">Hapus</button>
          </div>
          <div class="subtotal">${rupiah(subtotal)}</div>
        </div>`;
    }).join("");

    wadahK.innerHTML = notifHTML + baris +
      `<div class="total">Total: <strong>${rupiah(total)}</strong></div>
       <div class="formulir">
         <label for="nama">Nama lengkap</label>
         <input id="nama" type="text" placeholder="Contoh: Budi Santoso">
         <label for="wa">Nomor WhatsApp</label>
         <input id="wa" type="tel" placeholder="Contoh: 081234567890">
         <button class="tombol-checkout" id="tombol-checkout" onclick="checkout()">Checkout</button>
       </div>`;
  }

  async function checkout() {
    const nama = document.getElementById("nama").value.trim();
    let wa = document.getElementById("wa").value.replace(/[^0-9]/g, "");
    if (wa.startsWith("0")) wa = "62" + wa.slice(1);

    if (nama.length < 2) {
      renderKeranjang({ jenis: "gagal", teks: "Nama wajib diisi." });
      return;
    }
    if (!/^[0-9]{9,15}$/.test(wa)) {
      renderKeranjang({ jenis: "gagal", teks: "Nomor WhatsApp tidak valid." });
      return;
    }
    if (keranjang.length === 0) {
      renderKeranjang({ jenis: "gagal", teks: "Keranjang masih kosong." });
      return;
    }

    const tombol = document.getElementById("tombol-checkout");
    tombol.disabled = true;
    tombol.textContent = "Menyimpan pesanan...";

    const items = keranjang.map(i => ({ variant_id: i.id, qty: i.qty }));
    const ringkasan = keranjang.map(i => "- " + i.produk + " (" + i.varian + ") x" + i.qty + " = " + rupiah(i.harga * i.qty)).join("\n");
    const total = keranjang.reduce((s, i) => s + i.harga * i.qty, 0);

    const { data: kodePesanan, error } = await supabase.rpc("buat_pesanan", {
      p_nama: nama,
      p_whatsapp: wa,
      p_items: items
    });

    if (error) {
      tombol.disabled = false;
      tombol.textContent = "Checkout";
      renderKeranjang({ jenis: "gagal", teks: "Gagal menyimpan pesanan: " + error.message });
      console.error(error);
      return;
    }

    // Pesanan sudah tersimpan di database, sekarang keranjang dikosongkan
    keranjang = [];
    simpanKeranjang();

    const teksWA =
      "Halo KIMMY STORE, saya mau pesan.\n" +
      "No. pesanan: " + kodePesanan + "\n" +
      "Nama: " + nama + "\n\n" +
      ringkasan + "\n\n" +
      "Total: " + rupiah(total) + "\n\n" +
      "Mohon info cara pembayarannya. Terima kasih.";

    renderKeranjang({
      jenis: "sukses",
      teks: "Pesanan " + kodePesanan + " tersimpan. Status: menunggu pembayaran."
    });

    window.open("https://wa.me/" + WA_ADMIN + "?text=" + encodeURIComponent(teksWA), "_blank");
  }

  async function muatProduk() {
    if (!window.supabase) {
      wadah.innerHTML = '<p class="info">Gagal: library Supabase tidak termuat</p>';
      return;
    }

    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const { data, error } = await supabase
      .from("products")
      .select("id, name, categories(name), product_variants(id, name, price, stock_status, is_active)")
      .eq("is_active", true);

    if (error) {
      wadah.innerHTML = '<p class="info">Gagal: ' + error.message + '</p>';
      console.error(error);
      return;
    }

    if (!data || data.length === 0) {
      wadah.innerHTML = '<p class="info">Belum ada produk.</p>';
      return;
    }

    wadah.innerHTML = data.map(p => {
      const kategori = p.categories ? p.categories.name : "";
      const daftar = (p.product_variants || [])
        .filter(v => v.is_active)
        .map(v => {
          daftarVarian[v.id] = { produk: p.name, varian: v.name, harga: v.price };
          const tersedia = v.stock_status === "tersedia";
          return `
            <div class="varian">
              <div class="nama">${v.name}</div>
              <div class="harga">${rupiah(v.price)}</div>
              <span class="badge ${tersedia ? "tersedia" : "habis"}">${tersedia ? "Tersedia" : "Habis"}</span>
              ${tersedia
                ? `<button class="tombol" onclick="tambahKeranjang(${v.id})">Tambah ke keranjang</button>`
                : ""}
            </div>`;
        }).join("");

      return `
        <div class="card">
          <div class="kategori">${kategori}</div>
          <h3>${p.name}</h3>
          ${daftar || '<p>Belum ada varian.</p>'}
        </div>`;
    }).join("");
  }

  renderKeranjang();
  muatProduk();
</script>

</body>
</html>
